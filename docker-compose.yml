services:
  postgres:
    image: postgres:16-alpine
    container_name: campusq_db
    restart: always
    environment:
      POSTGRES_DB: campusq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusq_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campusq
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: supersecret_production_campusq_jwt_key_2026
    depends_on:
      - postgres

volumes:
  pgdata:
